services:
  # T1 — the one PostgreSQL service. Database, roles, citext and the two
  # schemas are created once by postgres-init; application tables are created
  # by each owner's migration runner. 5432 is deliberately NOT published to the
  # host: every consumer is on subnet_acl_shared (R1.1/R9.4).
  subnet-acl-postgres:
    image: postgres:16.4
    container_name: subnet-acl-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-subnet_acl}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-subnet_acl_pg_admin}
      - REGISTRY_DB_PASSWORD=${REGISTRY_DB_PASSWORD:-registry_app_pw}
      - GATEWAY_DB_PASSWORD=${GATEWAY_DB_PASSWORD:-gateway_app_pw}
      - GATEWAY_READER_DB_PASSWORD=${GATEWAY_READER_DB_PASSWORD:-gateway_reader_pw}
    volumes:
      # PGDATA is part of the backup set (R8.6). A named volume lets Docker
      # create it with the postgres image's ownership; a host bind directory
      # created by root would make the server refuse to start.
      - ${PGDATA_VOLUME:-subnet-acl-pgdata}:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - subnet_acl_shared
    restart: unless-stopped

  subnet-acl-provision-api:
    build:
      context: ./user_provision_tool

    container_name: subnet-acl-provision-api
    ports:
      # Operator boundary only: loopback by default (R9.2/R9.4).
      - "127.0.0.1:${PROVISION_API_PORT:-8875}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same-path bind-mount so generated compose files reference valid host paths
      - ${PROVISION_DIR:-/srv/provision_subnet_acl}:${PROVISION_DIR:-/srv/provision_subnet_acl}
      # Mount SSL provider path (e.g. /etc/letsencrypt) so path-based cert
      # imports and full-path cert references work without manual copying
      - ${SSL_PROVIDER_PATH:-/etc/letsencrypt}:${SSL_PROVIDER_PATH:-/etc/letsencrypt}:ro
    networks:
      - subnet_acl_shared
    environment:
      # The keyring lives under PROVISION_DIR/keys; same-path mount above.
      - PROVISION_DIR=${PROVISION_DIR:-/srv/provision_subnet_acl}
      - SSL_PROVIDER_PATH=${SSL_PROVIDER_PATH:-/etc/letsencrypt}
      - GENERATED_DIR=${PROVISION_DIR:-/srv/provision_subnet_acl}/generated
      - USER_DATA_DIR=${PROVISION_DIR:-/srv/provision_subnet_acl}/user_data
      - SOURCE_PROJECTS_DIR=${PROVISION_DIR:-/srv/provision_subnet_acl}/source_projects
      - REGISTRY_FILE=${PROVISION_DIR:-/srv/provision_subnet_acl}/generated/user_registry.yml
      # T1 — the registry schema is the live store. The YAML path above stays
      # only as the migration/rollback source until T12 retires it.
      - DATABASE_URL=postgresql://registry_app:${REGISTRY_DB_PASSWORD:-registry_app_pw}@subnet-acl-postgres:5432/${POSTGRES_DB:-subnet_acl}
      - NGINX_CONTAINER=subnet-acl-nginx
      # The network whose IPv4 subnet a stream block's `allow` rule names. It is
      # the same network this compose already attaches the -api to; the value is
      # resolved at render time with `docker network inspect`, never hardcoded in
      # the application. Required for a stream registration (fail-closed); an
      # HTTP one proceeds without it.
      - SHARED_NETWORK=${SHARED_NETWORK:-subnet_acl_shared}
      # Per-stack namespace for instance networks, container names and named volumes.
      # Networks/containers/volumes are global to the Docker daemon, so without this two
      # stacks on one host derive the same names for the same (service, user, label) and the
      # second deploy fails ("network … has active endpoints"). Set it per stack; empty
      # preserves the historical unprefixed names.
      - RESOURCE_PREFIX=${RESOURCE_PREFIX:-subnet-acl-}
      - DOCKER_OPS_LOG=${PROVISION_DIR:-/srv/provision_subnet_acl}/generated/docker_ops.log
      - TASK_LOG_DIR=${PROVISION_DIR:-/srv/provision_subnet_acl}/generated/task_logs
      - TASK_TTL_SECONDS=${TASK_TTL_SECONDS:-604800}
      - TASK_MAX_COUNT=${TASK_MAX_COUNT:-1000}
      - SSL_DIR=${PROVISION_DIR:-/srv/provision_subnet_acl}/ssl
      - SUBNET_POOLS=${SUBNET_POOLS:-}
      - SUBNET_HEADROOM=${SUBNET_HEADROOM:-2}
      # v5 (decision 1): -api does NOT read ENABLE_ACL / PORTAL_MODE — they touch
      # only the gateway and the edge -nginx-acl. The internal confs are simple.
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  subnet-acl-nginx:
    image: nginx:alpine
    container_name: subnet-acl-nginx
    ports:
      # THIS BASE FILE IS THE FULLSET SHAPE: the edge -nginx-acl is the only host
      # door, so the internal nginx publishes no STREAM port here — its stream
      # listener routes for the edge alone (task-doc R8.1/T5). The minimal shape
      # publishes that door with the overlay: `-f docker-compose.provision.yml
      # -f docker-compose.minimal.yml`. Publishing in the base and suppressing in
      # an overlay would have made the INSECURE shape the default.
      #
      # The 80/443 publishes stay — but LOOPBACK-BOUND (GRILLING G44). The
      # end state is the platform's own premise: the edge is the only door, so
      # the internal nginx's web ports are not reachable from another machine.
      # They remain reachable from the OPERATOR's machine, which is what lets the
      # minimal shape's behaviours be exercised on this stack without bringing a
      # second one up — and that is the whole point of keeping them at all.
      #
      # Measured before it was ruled: the published door delivers onto a CUSTOMER
      # network's address (the port DNATs to the container's address on a tenant
      # bridge, so an outside client is logged as that bridge's gateway — a
      # customer-pool address), which is why the small shape's test was refused.
      # Round 1 read that as "the guard refuses the very client it exists for"
      # and proposed weakening the guard; the guard is CORRECT (the pools are
      # disjoint), and the defect is where the door delivers. Loopback binding is
      # the publish-side half of that answer and needs no guard change.
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      # Same-path bind-mount so htpasswd paths in generated confs resolve correctly
      - ${PROVISION_DIR:-/srv/provision_subnet_acl}:${PROVISION_DIR:-/srv/provision_subnet_acl}:ro
      # Services-only assembly (v5 §5, §11.4): GENERATED_DIR is mounted at
      # /etc/nginx/services.d so the `include /etc/nginx/services.d/*.conf;`
      # glob picks up the generated *.nginx.conf files. NO env.d / portal.d
      # mounts — the portal and ACL moved to the edge -nginx-acl.
      - ./nginx.provision.conf:/etc/nginx/nginx.provision.conf:ro
      - ${PROVISION_DIR:-/srv/provision_subnet_acl}/generated:/etc/nginx/services.d:ro
    networks:
      # G91 — no static IP pin. The edge and the cross nginx resolve the name
      # at request time through a variable upstream, so a recreate that moves
      # this container is picked up within the resolver's valid=10s window.
      - subnet_acl_shared
    environment:
      - GENERATED_DIR=${PROVISION_DIR:-/srv/provision_subnet_acl}/generated
    # envsubst substitutes only $GENERATED_DIR; all nginx $variables are left intact.
    command: >
      /bin/sh -c "mkdir -p /etc/nginx/services.d &&
      envsubst '$$GENERATED_DIR' < /etc/nginx/nginx.provision.conf > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    restart: unless-stopped

volumes:
  # PGDATA is part of the backup set (R8.6); the logical dump is the restore
  # path. The name is pinned so a compose project rename cannot silently
  # orphan the live database.
  subnet-acl-pgdata:
    name: ${PGDATA_VOLUME:-subnet-acl-pgdata}

networks:
  subnet_acl_shared:
    external: true
    name: ${SHARED_NETWORK:-subnet_acl_shared}

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [HTTP $time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Docker embedded DNS — resolves container hostnames dynamically at request
    # time (used together with variable-based proxy_pass in per-user confs).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ------------------------------------------------------------------
    # Services-only internal nginx (acl-enforcement-design-v5 §5, §11.2).
    # The internal -nginx is a dumb per-service router: server_name +
    # auth_basic + proxy_pass. NO portal.d, NO env.d — the portal and the
    # ACL gate live entirely at the edge -nginx-acl. Identical in minimal
    # and fullset (byte-identical per-service confs, decision 7).
    # ------------------------------------------------------------------
    include /etc/nginx/services.d/*.conf;

    # Default_server 444 catch-all: any Host that matches no server block is
    # silently dropped (review GAP-29).
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}

stream {
    log_format  stream_format  '$remote_addr - [STREAM $time_local] '
                               '$protocol $status $bytes_sent $bytes_received '
                               '$session_time';

    access_log  /var/log/nginx/access.log  stream_format;
    include ${GENERATED_DIR}/*.stream.conf;
}

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [HTTP $time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Docker embedded DNS — resolves container hostnames dynamically at request
    # time (used together with variable-based proxy_pass in per-user confs).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Per-user virtual hosts — one .nginx.conf per registered user/service/label.
    # ${GENERATED_DIR} is substituted by envsubst at container startup.
    include ${GENERATED_DIR}/*.nginx.conf;

    # ------------------------------------------------------------------
    # ACL browser/API discriminator (acl-enforcement-design-v2 §4.3).
    # Only the $http_accept-derived map lives here (a built-in variable).
    # $auth_action / $service_basic are consumed directly in the per-service
    # server blocks (set by auth_request_set), so they need no http-level map.
    # ------------------------------------------------------------------
    map $http_accept $is_browser {
        "~text/html"  1;
        default       0;
    }

    # Dashboard host:port for ACL redirect targets (acl-enforcement-design-v2 §4.3).
    # Centralized here (http level) so per-service server blocks reference
    # $dashboard_host instead of a hardcoded host:port. Update this one line to
    # move the dashboard to a different host/port.
    map $host $dashboard_host {
        default "localhost:8775";
    }

    # Management server block for dashboard domain.
    # Routes API/backend traffic to provision-gateway and frontend SPA to
    # provision-dashboard (React app serving /alert, /login, and root routes).
    server {
        listen       80;
        server_name  subnet-acl-gateway.*;

        # API routes → provision-gateway
        location /api/ {
            proxy_pass http://subnet-acl-gateway:8770;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service redirect (GET /go/{hostname}) → provision-gateway /api/auth/go/{hostname}
        location /go/ {
            rewrite ^/go/(.*) /api/auth/go/$1 break;
            proxy_pass http://subnet-acl-gateway:8770;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Login page / POST → provision-gateway
        location /login {
            proxy_pass http://subnet-acl-gateway:8770;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Alert pages (token_expired, acl_denied) → provision-dashboard SPA
        location /alert {
            proxy_pass http://subnet-acl-dashboard:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard SPA root → provision-dashboard (lowest priority catch-all)
        location / {
            proxy_pass http://subnet-acl-dashboard:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

stream {
    log_format  stream_format  '$remote_addr - [STREAM $time_local] '
                               '$protocol $status $bytes_sent $bytes_received '
                               '$session_time';

    access_log  /var/log/nginx/access.log  stream_format;
    include ${GENERATED_DIR}/*.stream.conf;
}

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [HTTP $time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Generated services.d server_names (e.g. <svc>-<user>-<label>.<domain>)
    # exceed the default 64-byte bucket with ngx_hash_elt_t overhead — raise
    # it so nginx can build server_names_hash (regression: 2026-09-01 crash-loop).
    server_names_hash_bucket_size 128;

    # Docker embedded DNS — resolves container hostnames dynamically at request
    # time (used together with variable-based proxy_pass in per-user confs).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ------------------------------------------------------------------
    # Services-only internal nginx (acl-enforcement-design-v5 §5, §11.2).
    # The internal -nginx is a dumb per-service router: server_name +
    # auth_basic + proxy_pass. NO portal.d, NO env.d — the portal and the
    # ACL gate live entirely at the edge -nginx-acl. Identical in minimal
    # and fullset (byte-identical per-service confs, decision 7).
    # ------------------------------------------------------------------
    # SERVICES ONLY — by CATEGORY, not by "anything ending in .conf".
    #
    # This glob used to be `*.conf`, which ALSO matches the stream category's
    # files (`<svc>.user-<user>.<label>.stream.conf`): the stream conf was then
    # parsed as an http server block, and nginx refused to load the whole config
    # ("proxy_pass directive is not allowed here" — measured 2026-10-10, the
    # first time a stream conf appeared in this directory). The failure is
    # platform-wide, not local: a reload would keep the OLD config running, but a
    # restart would take every service down with it.
    #
    # The category is in the FILE NAME (task-doc R1.1's rename), so the include
    # names its category too. Today the http confs are still `*.nginx.conf`
    # (the rename to `*.http.conf` and the one-off sweep are R1.1's work); this
    # line follows the name when they change.
    include /etc/nginx/services.d/*.nginx.conf;

    # Default_server 444 catch-all: any Host that matches no server block is
    # silently dropped (review GAP-29).
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}

stream {
    # R4-F61 — the stream context builds its OWN server_names hash, and it does
    # NOT inherit the http block's bucket size. The default (64) cannot hold the
    # canonical names, which are the longest names the platform serves
    # (`<instance host>--<sub_service>.<domain>` — R1.5's one-label extra
    # endpoint, and the stream path's own name). Measured live 2026-10-11, the
    # first real deploy that produced a `*.stream.conf`:
    #
    #   nginx: [emerg] could not build server_names_hash, you should increase
    #   server_names_hash_bucket_size: 64
    #
    # — the WHOLE configuration refused, so the internal nginx could not reload
    # and every service was one restart away from being down. T9's §7 boundary
    # item is exactly this ("the canonical name must fit
    # server_names_hash_bucket_size — raised on the internal nginx as the http
    # side already does"); it had never been run against a real conf.
    server_names_hash_bucket_size 128;

    # R7.3 — the log carries the CANONICAL NAME and never a handle. On this
    # listener the SNI *is* the canonical name (the edge dials it, task-doc
    # R4.4), so `$ssl_server_name` is exactly the name the rule wants. The edge
    # deliberately logs nothing of the sort: what IT sees in the SNI is an
    # exposure handle — a credential in the clear — and a log must not become a
    # credential store.
    log_format  stream_format  '$remote_addr - [STREAM $time_local] $ssl_server_name '
                               '$protocol $status $bytes_sent $bytes_received '
                               '$session_time';

    access_log  /var/log/nginx/access.log  stream_format;
    include ${GENERATED_DIR}/*.stream.conf;
}

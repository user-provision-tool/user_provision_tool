user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [HTTP $time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Docker embedded DNS — resolves container hostnames dynamically at request
    # time (used together with variable-based proxy_pass in per-user confs).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ------------------------------------------------------------------
    # Unified nginx assembly (acl-enforcement-design-v4 §9, §11.3).
    # ONE nginx.conf for both deployments:
    #   portal.d/   → portal management block(s), per PORTAL_MODE (write_portal_d)
    #   services.d/ → per-user virtual hosts (generated *.nginx.conf)
    #                 (GENERATED_DIR is mounted here by docker-compose.provision.yml)
    # env.d/ is NOT included here: the mode-switch one-liner uses `set`
    # (server/location context only), so each per-service conf includes
    # /etc/nginx/env.d/*.env at server level (F2). An empty env.d (minimal /
    # gateway-less deployment) leaves $auth_mode "" ⇒ the per-service
    # /__basic__/ Basic short-circuit fires with 0 gateway subrequests (F5/B12).
    # The http-level Accept map ($is_browser) is GONE — client type is decided
    # by the gateway and relayed via X-Client-Type (GAP-11).
    # ------------------------------------------------------------------
    include /etc/nginx/portal.d/*.conf;
    include /etc/nginx/services.d/*.conf;

    # Default_server 444 catch-all: any Host that matches no server block is
    # silently dropped (review GAP-29).
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}

stream {
    log_format  stream_format  '$remote_addr - [STREAM $time_local] '
                               '$protocol $status $bytes_sent $bytes_received '
                               '$session_time';

    access_log  /var/log/nginx/access.log  stream_format;
    include ${GENERATED_DIR}/*.stream.conf;
}
